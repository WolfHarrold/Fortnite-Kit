name = "fortnite-kit"
main = "worker/worker.js"
compatibility_date = "2026-11-01"

# No CORS by default: the Loot Terminal page is served by this Worker (same origin).
# To let a second site call the API, uncomment:
# [vars]
# ALLOWED_ORIGIN = "https://wolfharrold.github.io"
# RATE_LIMIT = "30"   # player lookups per IP per 5 minutes

# Optional: keep the 20-minute cache across Worker restarts
# [[kv_namespaces]]
# binding = "FN_CACHE"
# id = "<your KV namespace id>"

# Secrets (do not put them in this file):
#   npx wrangler secret put FORTNITE_API_COM_KEY
#   npx wrangler secret put FORTNITE_API_IO_KEY
