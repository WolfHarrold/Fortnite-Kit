<!DOCTYPE html>
<html lang="en-AU" data-ph="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loot Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Roboto:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* Loot Terminal — Phosphor design system (one hue, four tiers, fixed zones).
   Layout idea: header tabs + sub-tab row + scrolling content + fixed footer cells, on black. */
:root {
  --bg: #000000;
  --t1: #00ff00; --t2: #00be00; --t3: #007f00; --t4: #003f00;
  --alert: #c72d04;
  --vignette: inset 0 0 2rem #00ff0040;
  --focus: 0 0 0 1px #000000, 0 0 0 2px #00ff00;
  --f-tab: "Roboto Condensed", "Arial Narrow", sans-serif;
  --f-list: Roboto, Arial, sans-serif;
  --f-mono: "Share Tech Mono", ui-monospace, monospace;
  --rule: 1px; --gap: 2px; --grid: 0.5rem;
  color-scheme: dark;
  font-size: clamp(15px, 2.1vw, 19px);
}
html[data-ph="amber"] { --t1:#ffbf00; --t2:#be8e00; --t3:#7f5f00; --t4:#3f2f00; --vignette: inset 0 0 2rem #ffbf0040; --focus: 0 0 0 1px #000, 0 0 0 2px #ffbf00; }
html[data-ph="blue"]  { --t1:#007fff; --t2:#007fff; --t3:#003f7f; --t4:#001f3f; --vignette: inset 0 0 2rem #007fff40; --focus: 0 0 0 1px #000, 0 0 0 2px #007fff; }
html[data-ph="white"] { --t1:#ffffff; --t2:#bebebe; --t3:#7f7f7f; --t4:#3f3f3f; --vignette: inset 0 0 2rem #ffffff40; --focus: 0 0 0 1px #000, 0 0 0 2px #ffffff; }

* { box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--t1); }
body { font-family: var(--f-list); font-weight: 700; overflow: hidden; }
button, input, select { font: inherit; color: inherit; background: none; border: 0; }
:focus-visible { outline: none; box-shadow: var(--focus); }
.glow { text-shadow: 0 0 0.4rem; }

/* ---------- zones ---------- */
/* Height comes from window.visualViewport (set in JS as --vvh): the area the browser really shows. */
.screen { position: fixed; top: var(--vvt, 0px); left: 0; right: 0; height: var(--vvh, 100dvh); display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; max-width: 1100px; margin: 0 auto;
  padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left)); }
.brand { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-mono); font-size: 0.72rem; color: var(--t2); padding: 0.4rem 0 0.1rem; text-transform: uppercase; letter-spacing: 0.04em; }
.brand b { color: var(--t1); font-weight: 400; }

nav.tabs { position: relative; display: flex; justify-content: space-between; padding: 0 1.1rem; border-bottom: var(--rule) solid var(--t1); height: 2rem; align-items: flex-end; }
nav.tabs::before, nav.tabs::after { content: ""; position: absolute; bottom: calc(-1 * var(--gap) - 1px); width: var(--rule); height: var(--gap); background: var(--t1); }
nav.tabs::before { left: 0; } nav.tabs::after { right: 0; }
.tab { position: relative; font-family: var(--f-tab); font-size: 1.05rem; line-height: 1.6rem; text-transform: uppercase; cursor: pointer; padding: 0 0.15rem; color: var(--t1); }
.tab.on::before { content: ""; position: absolute; left: -4px; right: -3px; bottom: -1px; height: 1px; background: var(--bg); }
.tab.on::after { content: ""; position: absolute; left: -4px; right: -3px; bottom: -1px; height: 0.7rem; border-left: 1px solid var(--t1); border-right: 1px solid var(--t1);
  background: linear-gradient(var(--t1), var(--t1)) left top / 3px 1px no-repeat, linear-gradient(var(--t1), var(--t1)) right top / 3px 1px no-repeat; }

.subtabs { display: flex; gap: 1rem; justify-content: center; height: 1.9rem; align-items: center; margin-top: var(--gap); overflow-x: auto; scrollbar-width: none; }
.subtabs:empty { height: 0.4rem; }
.sub { font-family: var(--f-tab); font-size: 0.95rem; text-transform: uppercase; color: var(--t3); cursor: pointer; white-space: nowrap; transition: color calc(120ms * var(--speed, 1)) linear; }
.sub.on { color: var(--t1); }

main { overflow-y: auto; overflow-x: hidden; padding: 0.5rem 0 0.75rem; scrollbar-color: var(--t3) transparent; scrollbar-width: thin; }

footer.foot { display: grid; gap: var(--gap); grid-auto-flow: column; grid-auto-columns: 1fr; margin: 0.35rem 0 0.5rem; }
.cell { background: var(--t4); color: var(--t1); font-family: var(--f-tab); font-size: 0.82rem; text-transform: uppercase; padding: 0.2rem 0.5rem; display: flex; gap: 0.5rem; align-items: center; justify-content: space-between; min-height: 1.5rem; white-space: nowrap; overflow: hidden; }
.cell .xp { flex: 1; height: 0.45rem; border: 1px solid var(--t1); max-width: 6rem; }
.cell .xp i { display: block; height: 100%; background: var(--t1); }

/* ---------- content parts ---------- */
.prompt { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; font-family: var(--f-mono); text-transform: uppercase; margin-bottom: 0.75rem; }
.prompt label { color: var(--t2); }
.prompt input[type=text] { flex: 1 1 9rem; min-width: 0; border-bottom: 1px solid var(--t1); padding: 0.2rem 0.1rem; font-family: var(--f-mono); text-transform: none; }
.btn { font-family: var(--f-tab); text-transform: uppercase; border: 1px solid var(--t1); padding: 0.15rem 0.6rem; cursor: pointer; }
.btn:hover, .btn.on { background: var(--t1); color: var(--t4); text-shadow: none; }
.btn:disabled { color: var(--t3); border-color: var(--t3); background: none; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--t1); }
.seg button { padding: 0.15rem 0.5rem; font-family: var(--f-tab); text-transform: uppercase; cursor: pointer; }
.seg button.on { background: var(--t1); color: var(--t4); text-shadow: none; }

.split { display: grid; grid-template-columns: 58% 1fr; gap: 1rem; align-items: start; }
@media (max-width: 640px) { .split { grid-template-columns: 1fr; } }

.list { list-style: none; margin: 0; padding: 0; }
.row { position: relative; display: flex; justify-content: space-between; gap: 0.75rem; padding: 0.18rem 0.5rem 0.18rem 1.3rem; cursor: pointer; line-height: 1.35; }
.row .r { font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.cur { background: var(--t1); color: var(--t4); text-shadow: none; }
.row.act::before { content: ""; position: absolute; left: 0.45rem; top: 50%; width: 4px; height: 4px; margin-top: -2px; background: currentColor; }
.row.dim { color: var(--t3); cursor: default; }
.row .s { color: var(--t2); font-size: 0.82rem; }
.row.cur .s { color: var(--t4); }

.cards { display: grid; gap: 1px; }
.card { background: var(--t4); padding: 0.3rem 0.55rem; display: flex; justify-content: space-between; gap: 0.75rem; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.card.hi { outline: 1px solid var(--t1); outline-offset: -1px; }
.card .k { color: var(--t1); text-transform: uppercase; font-family: var(--f-tab); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 0.5rem; }
.fig { border: 1px solid var(--t3); padding: 0.45rem 0.6rem; }
.fig .k { font-family: var(--f-tab); font-size: 0.75rem; color: var(--t2); text-transform: uppercase; }
.fig .v { font-family: var(--f-tab); font-size: 1.65rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fig .n { font-size: 0.75rem; color: var(--t2); }

.h { font-family: var(--f-tab); text-transform: uppercase; font-size: 0.95rem; margin: 0.9rem 0 0.4rem; display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px solid var(--t3); padding-bottom: 0.15rem; }
.h:first-child { margin-top: 0; }
.h .s { color: var(--t2); }
.p { font-size: 0.88rem; color: var(--t2); max-width: 65ch; line-height: 1.45; margin: 0.3rem 0; font-weight: 700; }
.p b { color: var(--t1); }
.big { font-family: var(--f-tab); font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }

.bar { height: 0.55rem; border: 1px solid currentColor; min-width: 3rem; flex: 1; }
.bar i { display: block; height: 100%; background: currentColor; }
.barrow { display: flex; align-items: center; gap: 0.6rem; }

.tint { position: relative; background: var(--t1); overflow: hidden; aspect-ratio: 1; display: grid; place-items: center; }
.tint img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; filter: grayscale(1) contrast(1.15); display: block; }
.tint.wide { aspect-ratio: 16/9; }
.ph { background: var(--t4); aspect-ratio: 1; display: grid; place-items: center; font-family: var(--f-mono); color: var(--t1); font-size: 1.4rem; border: 1px solid var(--t3); }
.ph.wide { aspect-ratio: 16/9; font-size: 0.9rem; }
/* Square item pictures stay small; wide (news/map) pictures may fill the width. */
.tint:not(.wide):not(.map), .ph:not(.wide) { max-width: 11rem; width: 100%; margin: 0 auto; }

.field { display: grid; gap: 0.25rem; margin: 0.6rem 0; }
.field label { font-family: var(--f-tab); text-transform: uppercase; font-size: 0.85rem; color: var(--t2); }
.field input[type=text], .field input[type=password], .field input[type=number], .field input[type=url] { border: 1px solid var(--t3); padding: 0.3rem 0.45rem; font-family: var(--f-mono); width: 100%; max-width: 28rem; }
.field .hint { font-size: 0.78rem; color: var(--t2); max-width: 60ch; }
.inline { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

.msg { font-family: var(--f-mono); text-transform: uppercase; padding: 0.4rem 0; }
.alert { animation: blink calc(1s * var(--speed, 1)) steps(1) infinite; }
@keyframes blink { 50% { color: var(--alert); } }
.cursor::after { content: "▮"; animation: blink2 0.3s steps(1) infinite; }
@keyframes blink2 { 50% { opacity: 0; } }

svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--t2); font-family: var(--f-tab); font-size: 10px; }
canvas.map { width: 100%; height: auto; display: block; border: 1px solid var(--t3); }

/* ---------- guide ---------- */
.gsec { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.gline { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--t4); font-size: 0.9rem; line-height: 1.4; }
.gtag { flex: none; font-family: var(--f-tab); font-size: 0.7rem; text-transform: uppercase; color: var(--t2); border: 1px solid var(--t2); padding: 0 0.3rem; margin-top: 0.15rem; }
.gtag-doubt { border-style: dashed; }
.glink { color: var(--t1); text-decoration: underline; text-underline-offset: 2px; }
.sched { display: flex; justify-content: space-between; gap: 0.75rem; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--t4); font-variant-numeric: tabular-nums; font-size: 0.9rem; }
.sched .r { font-family: var(--f-tab); font-size: 0.78rem; color: var(--t2); text-align: right; }
.sched-next { outline: 1px solid var(--t1); outline-offset: -1px; }
.sched-live { background: var(--t1); color: var(--t4); text-shadow: none; }
.sched-live .r { color: var(--t4); }

/* ---------- effects (top layers, never hide data) ---------- */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.fx.scan { background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.35) 0 1px, transparent 1px 2px); }
.fx.band { background: linear-gradient(to bottom, transparent 0, color-mix(in srgb, var(--t1) 6%, transparent) 50%, transparent 100%); height: 18vh; animation: roll calc(8s * var(--speed, 1)) linear infinite; }
@keyframes roll { from { transform: translateY(-20vh); } to { transform: translateY(110vh); } }
.fx.vig { box-shadow: var(--vignette); }
body.nofx .fx { display: none; }
body.nofx .glow { text-shadow: none; }
.jolt { animation: jolt 180ms steps(3) 1; }
@keyframes jolt { 0% { transform: translateY(3px); filter: brightness(1.5) blur(0.6px); } 50% { transform: translateY(-2px); } 100% { transform: none; filter: none; } }

.boot { position: fixed; inset: 0; z-index: 20; background: var(--bg); padding: 1.2rem; font-family: var(--f-mono); text-transform: uppercase; font-size: 0.8rem; color: var(--t1); overflow: hidden; cursor: pointer; }
.boot .hex { color: var(--t2); font-size: 0.6rem; line-height: 1.15; white-space: pre; }

@media (prefers-reduced-motion: reduce) {
  .fx.band { display: none; }
  .alert, .cursor::after { animation: none; }
  .jolt { animation: none; }
  .sub { transition: none; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body class="glow">
<div class="screen" id="screen">
  <div class="brand"><b>LOOT TERMINAL</b><span id="modeTag">DEMO</span></div>
  <nav class="tabs" id="tabs" aria-label="Main tabs"></nav>
  <div class="subtabs" id="subtabs" role="tablist" aria-label="Sub tabs"></div>
  <main id="content" tabindex="-1" aria-live="polite"></main>
  <footer class="foot" id="footer"></footer>
</div>
<div id="safeProbe" aria-hidden="true" style="position:fixed;left:0;top:0;width:0;height:0;padding-bottom:env(safe-area-inset-bottom);visibility:hidden"></div>
<div class="fx band" aria-hidden="true"></div>
<div class="fx scan" aria-hidden="true"></div>
<div class="fx vig" aria-hidden="true"></div>
<script>
(() => {
  // src/http.js
  var FortniteKitError = class extends Error {
    constructor(message, { status = 0, source = "", url = "", body = null } = {}) {
      super(message);
      this.name = "FortniteKitError";
      this.status = status;
      this.source = source;
      this.url = url;
      this.body = body;
    }
  };
  function buildUrl(base, path, params = {}) {
    const url = new URL(path.replace(/^\//, ""), base.endsWith("/") ? base : base + "/");
    for (const [k, v] of Object.entries(params)) {
      if (v === void 0 || v === null || v === "") continue;
      url.searchParams.set(k, String(v));
    }
    return url.toString();
  }
  async function getJson(url, { headers = {}, timeoutMs = 15e3, fetch: f = globalThis.fetch, source = "" } = {}) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    let res;
    try {
      res = await f(url, { headers: { Accept: "application/json", ...headers }, signal: ctrl.signal });
    } catch (err) {
      throw new FortniteKitError(`Network error: ${err.message}`, { source, url });
    } finally {
      clearTimeout(timer);
    }
    if (res.status === 204) return null;
    const text = await res.text();
    let body = null;
    try {
      body = text ? JSON.parse(text) : null;
    } catch {
      body = text;
    }
    if (!res.ok) {
      const msg = body && (body.error || body.message) || res.statusText || "Request failed";
      throw new FortniteKitError(`${source} ${res.status}: ${msg}`, { status: res.status, source, url, body });
    }
    return body;
  }

  // src/sources/fortniteApiCom.js
  var BASE = "https://fortnite-api.com";
  function createFortniteApiCom({ apiKey = "", language = "en", fetch: fetch2, timeoutMs } = {}) {
    const headers = apiKey ? { Authorization: apiKey } : {};
    const get = (path, params = {}) => getJson(buildUrl(BASE, path, params), { headers, fetch: fetch2, timeoutMs, source: "fortnite-api.com" }).then((r) => r?.data ?? r);
    return {
      source: "fortnite-api.com",
      // ---- Player stats (key required) ----
      // timeWindow: 'season' | 'lifetime'   accountType: 'epic' | 'psn' | 'xbl'
      // image: 'none' | 'all' | 'keyboardMouse' | 'gamepad' | 'touch' (returns a stats card image URL)
      statsByName: (name, { timeWindow = "season", accountType = "epic", image = "none" } = {}) => get("/v2/stats/br/v2", { name, accountType, timeWindow, image }),
      statsById: (accountId, { timeWindow = "season", image = "none" } = {}) => get(`/v2/stats/br/v2/${encodeURIComponent(accountId)}`, { timeWindow, image }),
      // ---- Game content (no key) ----
      shop: () => get("/v2/shop", { language }),
      news: (mode) => get(mode ? `/v2/news/${mode}` : "/v2/news", { language }),
      // mode: br | stw | creative
      cosmeticsAll: ({ responseFlags } = {}) => get("/v2/cosmetics", { language, responseFlags }),
      cosmeticsBr: ({ responseFlags } = {}) => get("/v2/cosmetics/br", { language, responseFlags }),
      cosmeticsNew: () => get("/v2/cosmetics/new", { language }),
      cosmeticById: (id, { responseFlags } = {}) => get(`/v2/cosmetics/br/${encodeURIComponent(id)}`, { language, responseFlags }),
      cosmeticSearch: (params) => get("/v2/cosmetics/br/search", { language, ...params }),
      cosmeticSearchAll: (params) => get("/v2/cosmetics/br/search/all", { language, ...params }),
      cosmeticsByIds: (ids) => get("/v2/cosmetics/br/search/ids", { language, id: ids.join(",") }),
      cosmeticsCars: () => get("/v2/cosmetics/cars", { language }),
      cosmeticsInstruments: () => get("/v2/cosmetics/instruments", { language }),
      cosmeticsTracks: () => get("/v2/cosmetics/tracks", { language }),
      // Festival jam tracks
      cosmeticsLego: () => get("/v2/cosmetics/lego", { language }),
      cosmeticsLegoKits: () => get("/v2/cosmetics/lego/kits", { language }),
      cosmeticsBeans: () => get("/v2/cosmetics/beans", { language }),
      // Fall Guys beans
      map: () => get("/v1/map", { language }),
      // current map image + POIs
      playlists: () => get("/v1/playlists", { language }),
      playlistById: (id) => get(`/v1/playlists/${encodeURIComponent(id)}`, { language }),
      banners: () => get("/v1/banners", { language }),
      bannerColors: () => get("/v1/banners/colors"),
      creatorCode: (name) => get("/v2/creatorcode", { name }),
      aes: () => get("/v2/aes")
      // game file keys + current build/version
    };
  }

  // src/sources/epicStatus.js
  var BASE2 = "https://status.epicgames.com/api/v2";
  function createEpicStatus({ fetch: fetch2, timeoutMs } = {}) {
    const get = (p) => getJson(`${BASE2}/${p}`, { fetch: fetch2, timeoutMs, source: "epic-status" });
    return {
      source: "epic-status",
      summary: () => get("summary.json"),
      unresolvedIncidents: () => get("incidents/unresolved.json"),
      upcomingMaintenance: () => get("scheduled-maintenances/upcoming.json"),
      // Only the Fortnite components, as { name: status }
      async fortnite() {
        const s = await get("summary.json");
        const out = { overall: s?.status?.description ?? "unknown", components: {} };
        const all = s?.components ?? [];
        const groupIds = new Set(all.filter((c) => c.group && /fortnite/i.test(c.name)).map((c) => c.id));
        for (const c of all) {
          if (c.group) continue;
          if (groupIds.has(c.group_id) || /fortnite/i.test(c.name)) out.components[c.name] = c.status;
        }
        return out;
      }
    };
  }

  // src/normalize.js
  var COUNT_FIELDS = ["matches", "wins", "kills", "deaths", "minutesPlayed", "score", "playersOutlived", "top3", "top5", "top6", "top10", "top12", "top25"];
  var round = (n2, dp = 2) => Math.round(n2 * 10 ** dp) / 10 ** dp;
  function emptyBlock() {
    return Object.fromEntries(COUNT_FIELDS.map((f) => [f, 0]));
  }
  function finishBlock(b) {
    if (!b) return null;
    const out = { ...emptyBlock(), ...b };
    if (!b.deaths) out.deaths = Math.max(out.matches - out.wins, 0);
    out.winRate = out.matches ? round(out.wins / out.matches * 100) : 0;
    out.kd = round(out.kills / Math.max(out.deaths, 1));
    out.killsPerMatch = out.matches ? round(out.kills / out.matches) : 0;
    out.killsPerMin = out.minutesPlayed ? round(out.kills / out.minutesPlayed, 3) : 0;
    out.scorePerMatch = out.matches ? round(out.score / out.matches) : 0;
    out.hoursPlayed = round(out.minutesPlayed / 60, 1);
    return out;
  }
  function pickBlock(raw) {
    if (!raw) return null;
    const b = {};
    for (const f of COUNT_FIELDS) b[f] = Number(raw[f] ?? 0);
    return finishBlock(b);
  }
  function fromFortniteApiCom(data, { timeWindow = "season" } = {}) {
    const s = data?.stats ?? {};
    const modes = (group) => ({
      solo: pickBlock(group?.solo),
      duo: pickBlock(group?.duo),
      trio: pickBlock(group?.trio),
      squad: pickBlock(group?.squad),
      ltm: pickBlock(group?.ltm)
    });
    return {
      source: "fortnite-api.com",
      timeWindow,
      fetchedAt: (/* @__PURE__ */ new Date()).toISOString(),
      account: { id: data?.account?.id ?? null, name: data?.account?.name ?? null },
      battlePass: data?.battlePass ?? null,
      image: data?.image ?? null,
      overall: pickBlock(s.all?.overall) ?? finishBlock(emptyBlock()),
      byMode: modes(s.all),
      byInput: {
        keyboardMouse: pickBlock(s.keyboardMouse?.overall),
        gamepad: pickBlock(s.gamepad?.overall),
        touch: pickBlock(s.touch?.overall)
      },
      byBuild: null,
      ranked: null,
      lastModified: s.all?.overall?.lastModified ?? null
    };
  }

  // src/odds.js
  var clamp01 = (x) => Math.min(1, Math.max(0, x));
  var perTry = (odds, multiplier = 1) => clamp01(multiplier / odds);
  function chanceAtLeastOne(odds, tries, multiplier = 1) {
    const p = perTry(odds, multiplier);
    if (tries <= 0 || p === 0) return 0;
    if (p === 1) return 1;
    return 1 - Math.exp(tries * Math.log1p(-p));
  }
  function chanceAtLeastOneMixed(odds, segments) {
    let logNone = 0;
    for (const { tries = 0, multiplier = 1 } of segments) {
      const p = perTry(odds, multiplier);
      if (p === 1 && tries > 0) return 1;
      logNone += tries * Math.log1p(-p);
    }
    return 1 - Math.exp(logNone);
  }
  function triesForChance(odds, target, multiplier = 1) {
    const p = perTry(odds, multiplier);

    if (d.action === "wipe") {
      try {
        Object.keys(localStorage).filter((k) => k.startsWith(LS)).forEach((k) => localStorage.removeItem(k));
      } catch {
      }
      location.reload();
    }
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id === "scanForm") {
      e.preventDefault();
      click();
      scan($("playerName").value);
    }
  });
  document.addEventListener("input", (e) => {
    const id = e.target.id;
    if (id === "rate") {
      const v = +e.target.value;
      if (v > 0) {
        S.chest.rate = v;
        lsSet("chestRate", v);
        renderFooter();
      }
      return;
    }
    if (["pMin", "pMatch", "pTh"].includes(id)) {
      const v = Math.max(0, +e.target.value || 0);
      if (id === "pMin") S.plan.minutes = v;
      if (id === "pMatch") S.plan.matches = v;
      if (id === "pTh") S.plan.thMinutes = v;
      const r = report();
      if (r && !r.error) $("planOut").innerHTML = planOut(r);
    }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "rate") render();
  });
  document.addEventListener("error", (e) => {
    if (e.target.tagName === "IMG") {
      const box = e.target.closest(".tint");
      if (box) box.outerHTML = `<div class="ph${box.classList.contains("wide") ? " wide" : ""}">${box.dataset.ph ?? ""}</div>`;
    }
  }, true);
  document.addEventListener("keydown", (e) => {
    const tag = e.target.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") {
      if (e.key === "Escape") e.target.blur();
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key.toLowerCase();
    if (k === "arrowleft") {
      e.preventDefault();
      goTab(S.tab - 1);
    } else if (k === "arrowright") {
      e.preventDefault();
      goTab(S.tab + 1);
    } else if (k === "a" || k === "q") goSub(S.sub[tabId()] - 1);
    else if (k === "d" || k === "e") goSub(S.sub[tabId()] + 1);
    else if (k === "arrowup") {
      e.preventDefault();
      moveCursor(-1);
    } else if (k === "arrowdown") {
      e.preventDefault();
      moveCursor(1);
    }
  });
  function bootSequence() {
    return new Promise((done) => {
      let seen = false;
      try {
        seen = sessionStorage.getItem("lt.booted") === "1";
        sessionStorage.setItem("lt.booted", "1");
      } catch {
      }
      if (!S.boot || seen || reducedMotion()) return done();
      const el = document.createElement("div");
      el.className = "boot";
      el.setAttribute("aria-hidden", "true");
      el.innerHTML = '<div class="hex"></div><div class="typed"></div>';
      document.body.appendChild(el);
      const hex = el.querySelector(".hex");
      const typed = el.querySelector(".typed");
      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        el.remove();
        done();
      };
      el.addEventListener("click", finish);
      let line = 0;
      const hexTimer = setInterval(() => {
        const addr = (164 + line * 16).toString(16).toUpperCase().padStart(6, "0");
        hex.textContent += `0X${addr} ${Array.from({ length: 4 }, () => Math.floor(Math.random() * 65535).toString(16).toUpperCase().padStart(4, "0")).join(" ")}
`;
        if (++line >= 14) {
          clearInterval(hexTimer);
          const text = `
LOOT TERMINAL
\u276F DATA LINK ........ ${S.resolved.toUpperCase()}
\u276F EVENT ............ ${treasure_hunters_2026_default.name.toUpperCase()}
\u276F READY`;
          let c = 0;
          const typeTimer = setInterval(() => {
            typed.textContent = text.slice(0, ++c);
            if (c >= text.length) {
              clearInterval(typeTimer);
              setTimeout(finish, 350);
            }
          }, 17);
        }
      }, 30);
    });
  }
  function fitViewport() {
    const vv = window.visualViewport;
    const h = vv ? vv.height : window.innerHeight;
    const top = vv ? vv.offsetTop : 0;
    document.documentElement.style.setProperty("--vvh", `${Math.round(h)}px`);
    document.documentElement.style.setProperty("--vvt", `${Math.round(top)}px`);
  }
  function screenInfo() {
    const vv = window.visualViewport;
    const f = $("footer")?.getBoundingClientRect();
    const safe = parseFloat(getComputedStyle($("safeProbe")).paddingBottom) || 0;
    return `INNER ${window.innerHeight} \xB7 VISUAL ${vv ? Math.round(vv.height) : "\u2014"} \xB7 SAFE ${Math.round(safe)} \xB7 FOOTER ${f ? Math.round(f.bottom) : "\u2014"} \xB7 DPR ${window.devicePixelRatio}`;
  }
  fitViewport();
  window.visualViewport?.addEventListener("resize", fitViewport);
  window.visualViewport?.addEventListener("scroll", fitViewport);
  window.addEventListener("resize", fitViewport);
  window.addEventListener("orientationchange", () => setTimeout(fitViewport, 300));
  (async function start() {
    render();
    await resolveMode();
    await bootSequence();
    render();
    if (S.resolved === "demo") {
      await scan("LilAvlis");
    } else if (S.player) {
      scan(S.player);
    }
  })();
})();

</script>
</body>
</html>
